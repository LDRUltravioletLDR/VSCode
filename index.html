<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #bbf1ff;
            color: #333;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #1a365d;
            margin-bottom: 5px;
        }

        h2 {
            color: #4a5568;
            font-weight: 400;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        form {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }

        h3 {
            color: #2b6cb0;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
            margin-top: 25px;
            font-size: 1.1rem;
            text-transform: capitalize;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }

        label {
            margin-left: 8px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        input[type="submit"] {
            background-color: #3182ce;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background-color 0.2s;
        }

        input[type="submit"]:hover {
            background-color: #2b6cb0;
        }
    </style>
</head>
<body>
    <h1> Rate A Movie </h1>
    <h2> Write A Review Of Any Movie </h2>
    <img src="" alt="Movie Poster Placeholder">
    <h2> Movie Information </h2>
    
    <form> 
        <label for="name"> Title Of The Movie </label>
        <input type="text" name="title" id="name" placeholder="write title here">
        
        <h3> Genre of the movie </h3>
        <input type="checkbox" id="action" name="genre" value="action">
        <label for="action">Action</label>
        <br> 
        <input type="checkbox" id="comedy" name="genre" value="Comedy">
        <label for="comedy">Comedy</label>
        <br> 
        <input type="checkbox" id="scifi" name="genre" value="Sci-Fi">
        <label for="scifi">Sci-Fi</label>
        <br> 
        <input type="checkbox" id="fantasy" name="genre" value="Fantasy">
        <label for="fantasy">Fantasy</label>
        <br> 
        <input type="checkbox" id="romance" name="genre" value="Romance">
        <label for="romance">Romance</label>
        <br> 
        <input type="checkbox" id="thriller" name="genre" value="Thriller">
        <label for="thriller">Thriller</label>
        <br> 

        <h3>Rating</h3>
        <input type="radio" id="1rating" name="rating" value="1">
        <label for="1rating"> ⭐ </label>   
        <br>
        <input type="radio" id="2rating" name="rating" value="2">
        <label for="2rating"> ⭐⭐ </label>   
        <br>
        <input type="radio" id="3rating" name="rating" value="3">
        <label for="3rating"> ⭐⭐⭐ </label>   
        <br>
        <input type="radio" id="4rating" name="rating" value="4">
        <label for="4rating"> ⭐⭐⭐⭐ </label>   
        <br>
        <input type="radio" id="5rating" name="rating" value="5">
        <label for="5rating"> ⭐⭐⭐⭐⭐ </label>   
        <br> 

        <h3>Share your thoughts! </h3>
        <label for="thoughts"> Write your thoughts: </label>
        <br>
        <textarea id="thoughts" name="thoughts" rows="4" cols="50" placeholder="type here"></textarea>
        <br><br>
        <input type="submit" value="Submit Review"> 
    </form>
</body>
</html>
